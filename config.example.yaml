# Launchy settings. Copy to config/config.yaml, set an admin password (npm run hash-password),
# then edit everything else at /settings. Secrets are written as ${NAME}: set them at Settings → Secrets
# (stored in secrets.yaml next to this file) or pass them as environment variables.

title: Launchy

# Shown to visitors who are not signed in. Remove to require a login.
public:
  name: Guest
  groups: [links]
  widgets: []

users:
  alex:
    name: Alex
    greeting: Alex
    admin: true                     # can open /settings
    password: scrypt:REPLACE_WITH_OUTPUT_OF_npm_run_hash-password
    theme: { accent: "#5b6cff" }
    groups: [home, media, work-tools]
    widgets: [briefing, mail, agenda, cameras, notes]   # widgets with an `app` appear in that app's panel

# Briefings use this model: any OpenAI-compatible server (Ollama: url ending in /v1) or Claude.
llm:
  provider: local
  url: http://192.168.1.10:11434/v1
  model: gemma3:12b

search:
  default: google
  providers:
    - { id: google, name: Google, bang: g, url: "https://www.google.com/search?q={q}", suggest: "https://suggestqueries.google.com/complete/search?client=firefox&q={q}" }
    - { id: ddg, name: DuckDuckGo, bang: d, url: "https://duckduckgo.com/?q={q}", suggest: "https://duckduckgo.com/ac/?type=list&q={q}" }
    - { id: wiki, name: Wikipedia, bang: w, url: "https://en.wikipedia.org/w/index.php?search={q}", suggest: "https://en.wikipedia.org/w/api.php?action=opensearch&limit=6&search={q}" }

# Every service, defined once. ping: the address the status dot checks (default: url; false = none).
# icon: a name from https://dashboard-icons.dev, an image address, or an emoji.
apps:
  home-assistant: { name: Home Assistant, url: "https://home.example.com", icon: home-assistant, ping: "http://192.168.1.10:8123" }
  cameras: { name: Cameras, url: "https://nvr.example.com", icon: frigate, ping: "http://192.168.1.10:8971" }
  jellyfin: { name: Movies & TV, url: "https://media.example.com", icon: jellyfin, ping: "http://192.168.1.10:8096" }
  photos: { name: Photos, url: "https://photo.example.com", icon: immich, ping: "http://192.168.1.10:2283" }
  mail: { name: Mail, url: "https://mail.example.com", icon: "✉️", ping: "http://192.168.1.10:9123" }
  calendar: { name: Calendar, url: "https://mail.example.com/#/calendar", icon: "📅", ping: false }
  notes: { name: Notes, url: "https://notes.example.com", icon: "🖋️", ping: "http://192.168.1.10:9124" }
  website: { name: Website, url: "https://example.com", icon: "🌐", ping: false }

groups:
  home: { title: Home, apps: [home-assistant, cameras] }
  media: { title: Photos & media, apps: [photos, jellyfin] }
  work-tools: { title: Mail & notes, apps: [mail, calendar, notes] }
  links: { title: Links, apps: [website] }

widgets:
  mail:
    type: halcyon
    app: mail
    title: Mail
    url: http://192.168.1.10:9123
    link: https://mail.example.com
    token: ${HALCYON_TOKEN}
  agenda:
    type: halcyon
    app: calendar
    show: events
    days: 7
    title: This week
    url: http://192.168.1.10:9123
    link: https://mail.example.com
    token: ${HALCYON_TOKEN}
  notes:
    type: http
    app: notes
    title: Recent notes
    url: http://192.168.1.10:9124/api/recent?limit=6
    headers: { Authorization: "Bearer ${NOTES_TOKEN}" }
    items: { path: "", title: "{icon} {title}", date: updatedAt, url: "https://notes.example.com/#/n/{id}" }
  cameras:
    type: http
    app: cameras
    title: Camera events
    url: http://192.168.1.10:5000/api/events?limit=5
    items: { path: "", title: "{label}", subtitle: "{camera}", date: start_time, url: "https://nvr.example.com/explore?event_id={id}", empty: No recent events. }
  briefing:                         # no app: shown on the start page
    type: ai
    title: Briefing
    sources: [mail, agenda, notes, cameras]
